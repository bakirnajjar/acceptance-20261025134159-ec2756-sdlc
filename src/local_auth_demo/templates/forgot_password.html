{% extends "base.html" %}
{% block title %}Forgot password · Local auth demo{% endblock %}
{% block content %}
  <section class="panel">
    <h1>Forgot password?</h1>
    <form method="post" action="{{ url_for('forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<p class="form-error" id="forgot-error" role="alert">{{ error }}</p>{% endif %}
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             {% if error %}aria-describedby="forgot-error" aria-invalid="true"{% endif %} required>
      <button type="submit">Request reset</button>
    </form>
    <p><a href="{{ url_for('sign_in') }}">Back to sign in</a></p>
  </section>
{% endblock %}
