{% extends "base.html" %}
{% block title %}Sign in · Local auth demo{% endblock %}
{% block content %}
  <section class="panel sign-in-panel" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Sign in</h1>
    <form method="post" action="{{ url_for('sign_in') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<p class="form-error" id="sign-in-error" role="alert">{{ error }}</p>{% endif %}
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="name@example.com"
             autocomplete="username" {% if error %}aria-describedby="sign-in-error"{% endif %} required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="********"
             autocomplete="current-password" {% if error %}aria-describedby="sign-in-error"{% endif %} required>
      <a class="recovery-link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <button type="submit">Sign in</button>
    </form>
    <p class="sign-in-footer">No account? Contact your administrator.</p>
  </section>
{% endblock %}
