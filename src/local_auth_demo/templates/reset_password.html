{% extends "base.html" %}
{% block title %}Reset password · Local auth demo{% endblock %}
{% block content %}
  <section class="panel">
    <h1>Reset password</h1>
    <form method="post" action="{{ url_for('reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<p class="form-error" id="reset-error" role="alert">{{ error }}</p>{% endif %}
      <label for="new-password">New password</label>
      <input id="new-password" name="new_password" type="password"
             autocomplete="new-password"
             {% if error %}aria-describedby="reset-error" aria-invalid="true"{% endif %} required>
      <button type="submit">Reset password</button>
    </form>
  </section>
{% endblock %}
